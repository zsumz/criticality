name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  canonical:
    name: canonical
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Set up reviewed zrail
        uses: ./.github/actions/setup-zrail
      - name: Set up zcheck
        uses: zactionsz/setup-zcheck@88ca70422145efd6ab7f4262fb096ecd16372f57
        with:
          version: "0.0.2"
          sha256: a9e3ca964b6f5e86c693edeff4aeaddb46ee9d62f8713d3ded0bb6533b758e53
      - name: Run canonical zcheck qualification
        env:
          ZCHECK_CACHE_DIR: ${{ runner.temp }}/zcheck
          ZCHECK_EVIDENCE_DIR: ${{ runner.temp }}/zcheck-evidence
        run: >-
          zcheck run check
          --format github
          --logs-dir "$ZCHECK_EVIDENCE_DIR/logs"
          --receipt "$ZCHECK_EVIDENCE_DIR/receipt.json"
      - name: Upload zcheck evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zcheck-canonical
          path: ${{ runner.temp }}/zcheck-evidence
          if-no-files-found: error
